name: Jepsen

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - baseline
          - follower
          - lazyfs
          - ha-convergence
      time-limit:
        description: 'Time limit per test, in seconds'
        required: true
        default: '90'

permissions:
  contents: write # push the results badge to the 'badges' branch
  checks: write

jobs:
  jepsen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch latest ArcadeDB build (main branch, via Docker image)
        run: ./fetch-arcadedb-image.sh

      - name: Build and start the Docker cluster
        working-directory: docker
        run: |
          docker compose build
          docker compose up -d

      - name: Set up SSH between control and nodes
        run: docker exec jepsen-control sh /jepsen/docker/setup-ssh.sh

      - name: Run Jepsen suite
        shell: bash
        run: |
          set +e
          SUITE="${{ github.event.inputs.suite || 'all' }}"
          TIME_LIMIT="${{ github.event.inputs['time-limit'] || '90' }}"
          OVERALL=0
          LOG=jepsen-run.log
          : > "$LOG"
          mkdir -p jepsen-logs

          # $1 = sweep script, $2 = suite name (also names the per-suite log
          # that the JUnit conversion step reads).
          run_one() {
            docker/ci-run-suite.sh "./$1" "$TIME_LIMIT" 2>&1 | tee -a "$LOG" "jepsen-logs/$2.log"
            return "${PIPESTATUS[0]}"
          }

          case "$SUITE" in
            baseline)
              run_one run-all-tests.sh baseline || OVERALL=1
              ;;
            follower)
              run_one run-follower-tests.sh follower || OVERALL=1
              ;;
            lazyfs)
              run_one run-lazyfs-tests.sh lazyfs || OVERALL=1
              ;;
            ha-convergence)
              run_one run-ha-convergence-tests.sh ha-convergence || OVERALL=1
              ;;
            all)
              run_one run-all-tests.sh baseline || OVERALL=1
              run_one run-follower-tests.sh follower || OVERALL=1
              run_one run-lazyfs-tests.sh lazyfs || OVERALL=1
              run_one run-ha-convergence-tests.sh ha-convergence || OVERALL=1
              ;;
            *)
              echo "Unknown suite: $SUITE"
              OVERALL=1
              ;;
          esac

          {
            echo "## Jepsen suite: $SUITE"
            echo '```'
            grep -E 'FINAL RESULTS|^  \[(PASS|FAIL|UNKNOWN)\]' "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $OVERALL

      - name: Convert Jepsen results to JUnit XML
        if: success() || failure()
        shell: bash
        run: |
          mkdir -p jepsen-reports
          for log in jepsen-logs/*.log; do
            [ -e "$log" ] || continue
            suite=$(basename "$log" .log)
            python3 docker/jepsen-log-to-junit.py "$suite" "$log" "jepsen-reports/TEST-jepsen-$suite.xml"
          done

      # The "Run Jepsen suite" step decides the job; the reporter only renders the check run and
      # is allowed to fail (e.g. missing checks permission) without turning the job red.
      - name: Jepsen Tests Reporter
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        continue-on-error: true
        if: success() || failure()
        with:
          name: Jepsen Tests Report (${{ github.event.inputs.suite || 'all' }})
          path: "jepsen-reports/TEST*.xml"
          list-tests: "failed"
          list-suites: "failed"
          reporter: java-junit
          fail-on-empty: false

      # README badge: a shields.io endpoint JSON force-pushed as the only commit of the orphan
      # 'badges' branch. Only full-suite runs on main update it, so a manual subset run never
      # overwrites the headline numbers.
      - name: Publish results badge
        if: (success() || failure()) && github.ref == 'refs/heads/main' && (github.event.inputs.suite || 'all') == 'all'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          mkdir -p badge-branch
          python3 docker/jepsen-junit-badge.py badge-branch/jepsen.json jepsen-reports/TEST*.xml
          cd badge-branch
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jepsen.json
          git commit -q -m "Jepsen results badge (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" badges

      # Jepsen names store directories with ISO timestamps (containing ':'), which
      # upload-artifact rejects, so the store is shipped as a tarball.
      - name: Collect Jepsen store
        if: always()
        run: |
          docker cp jepsen-control:/jepsen/store ./store || true
          if [ -d store ]; then tar -czf jepsen-store.tar.gz store; fi

      - name: Upload Jepsen store artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jepsen-store-${{ github.run_id }}
          path: |
            jepsen-store.tar.gz
            jepsen-logs
            jepsen-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down the Docker cluster
        if: always()
        working-directory: docker
        run: docker compose down -v
